name: Sudoku iOS

on:
  push:
    paths: ["SudokuApp/**", ".github/workflows/sudoku-ios.yml"]
  pull_request:
    paths: ["SudokuApp/**", ".github/workflows/sudoku-ios.yml"]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        working-directory: SudokuApp
        run: |
          # Runner images ship different simulators, so pick the first available iPhone.
          DEVICE_ID=$(xcrun simctl list devices available iPhone | grep -Eo '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -1)
          echo "Using simulator $DEVICE_ID"
          xcodebuild test \
            -project SudokuApp.xcodeproj \
            -scheme SudokuApp \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO
