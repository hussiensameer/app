<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فيديوهات رقّم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{background:#faf7f2;color:#0e1b24;font-family:"IBM Plex Sans Arabic",sans-serif;padding:24px 16px 64px;overflow-x:hidden}
main{max-width:520px;margin:0 auto}
h1{font-size:28px;font-weight:700;color:#0f7a7e;margin:8px 0 24px}
.card{background:#fff;border:1px solid #ded7cb;border-radius:16px;padding:16px;margin-bottom:20px}
.meta{color:#5e6b72;font-size:14px;margin-bottom:6px}
h2{font-size:20px;font-weight:600;margin-bottom:12px}
video{width:100%;border-radius:12px;background:#0e1b24;display:block;aspect-ratio:9/16}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;text-align:center;padding:12px 8px;border-radius:999px;border:0;font:600 16px "IBM Plex Sans Arabic",sans-serif;cursor:pointer;text-decoration:none}
.p{background:#0f7a7e;color:#fff}.s{background:#d8eded;color:#0b5f62}
</style>
</head>
<body>
<main>
<h1>فيديوهات رقّم</h1>
<div id="list"></div>
</main>
<script>
fetch('videos.json').then(r=>r.json()).then(items=>{
  const list=document.getElementById('list');
  items.forEach(v=>{
    const c=document.createElement('article');c.className='card';
    c.innerHTML='<div class="meta"></div><h2></h2><video controls playsinline preload="metadata"></video><div class="row"><a class="btn p" download>حمّل الفيديو</a><button class="btn s" type="button">انسخ الكابشن</button></div>';
    c.querySelector('.meta').textContent=v.date;
    c.querySelector('h2').textContent=v.title;
    c.querySelector('video').src='videos/'+v.file;
    c.querySelector('a').href='videos/'+v.file;
    const b=c.querySelector('button');
    b.onclick=async()=>{try{await navigator.clipboard.writeText(v.caption)}catch(e){const t=document.createElement('textarea');t.value=v.caption;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}b.textContent='تم النسخ';setTimeout(()=>b.textContent='انسخ الكابشن',1800)};
    list.appendChild(c);
  });
});
</script>
</body>
</html>
